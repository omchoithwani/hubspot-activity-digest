services:
  # Web service — keeps the app alive and serves the setup UI
  - type: web
    name: hubspot-digest
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_TOKEN
        sync: false   # Protect the /setup page — set a strong random token in the Render dashboard
      - key: TRIGGER_TOKEN
        sync: false   # Optional: protect the POST /trigger endpoint
      # Turso database (free cloud SQLite)
      - key: TURSO_DATABASE_URL
        sync: false   # e.g. libsql://your-db-name.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false   # Turso auth token
      # SMTP — Hostinger
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: om.choithwani@aero-rev.com
      - key: SMTP_PASS
        sync: false   # Your Hostinger email password
      - key: FROM_EMAIL
        value: om.choithwani@aero-rev.com
      - key: FROM_NAME
        value: "HubSpot Digest"

  # Cron job — runs the digest daily at 5:00 PM EST (22:00 UTC)
  - type: cron
    name: hubspot-digest-cron
    runtime: node
    region: oregon
    plan: free
    schedule: "0 22 * * *"
    buildCommand: npm install
    startCommand: node src/digest.js
    envVars:
      - key: NODE_ENV
        value: production
      - fromService:
          type: web
          name: hubspot-digest
          envVarKey: TURSO_DATABASE_URL
      - fromService:
          type: web
          name: hubspot-digest
          envVarKey: TURSO_AUTH_TOKEN
      - fromService:
          type: web
          name: hubspot-digest
          envVarKey: SMTP_HOST
      - fromService:
          type: web
          name: hubspot-digest
          envVarKey: SMTP_PORT
      - fromService:
          type: web
          name: hubspot-digest
          envVarKey: SMTP_USER
      - fromService:
          type: web
          name: hubspot-digest
          envVarKey: SMTP_PASS
      - fromService:
          type: web
          name: hubspot-digest
          envVarKey: FROM_EMAIL
      - fromService:
          type: web
          name: hubspot-digest
          envVarKey: FROM_NAME
