services:
  - type: web
    name: hubspot-digest
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_TOKEN
        sync: false
      - key: TRIGGER_TOKEN
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CRON_SCHEDULE
        value: "0 22 * * *"   # 5 PM EST — change if needed
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: om.choithwani@aero-rev.com
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        value: om.choithwani@aero-rev.com
      - key: FROM_NAME
        value: "HubSpot Digest"
