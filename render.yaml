services:
  # Web service — keeps the app alive and serves the setup UI
  - type: web
    name: hubspot-digest
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    disk:
      name: digest-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/config.db
      - key: ADMIN_TOKEN
        sync: false   # Protect the /setup page — set a strong random token
      - key: TRIGGER_TOKEN
        sync: false   # Optional: protect the POST /trigger endpoint
      # SMTP settings — all tenants' emails are sent through this server
      - key: SMTP_HOST
        sync: false   # e.g. smtp.gmail.com / smtp.sendgrid.net / smtp.resend.com
      - key: SMTP_PORT
        value: "587"  # 587 for TLS (STARTTLS), 465 for SSL
      - key: SMTP_USER
        sync: false   # e.g. apikey (SendGrid) or your email address (Gmail)
      - key: SMTP_PASS
        sync: false   # SMTP password or API key
      - key: FROM_EMAIL
        sync: false   # Sender address shown in the email (must be verified with your SMTP provider)
      - key: FROM_NAME
        value: "HubSpot Digest"

  # Cron job — runs the digest daily at 5:00 PM EST (22:00 UTC)
  - type: cron
    name: hubspot-digest-cron
    runtime: node
    region: oregon
    plan: free
    schedule: "0 22 * * *"   # 5:00 PM EST / 10:00 PM UTC
    buildCommand: npm install
    startCommand: node src/digest.js
    envVars:
      - key: DB_PATH
        value: /data/config.db
      - key: NODE_ENV
        value: production
      - fromService:
          type: web
          name: hubspot-digest
          envVarKey: SMTP_HOST
      - fromService:
          type: web
          name: hubspot-digest
          envVarKey: SMTP_PORT
      - fromService:
          type: web
          name: hubspot-digest
          envVarKey: SMTP_USER
      - fromService:
          type: web
          name: hubspot-digest
          envVarKey: SMTP_PASS
      - fromService:
          type: web
          name: hubspot-digest
          envVarKey: FROM_EMAIL
      - fromService:
          type: web
          name: hubspot-digest
          envVarKey: FROM_NAME
